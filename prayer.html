<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>Prayer Times</title>
<link rel="manifest" href="./manifest-prayer.json">
<meta name="theme-color" content="#071226">
<link rel="icon" href="./prayer-icon-192.png">
<link rel="apple-touch-icon" href="./prayer-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prayer Times">
<script>try{var __t=localStorage.getItem("rakah-theme");if(__t)document.documentElement.setAttribute("data-theme",__t);if(localStorage.getItem("rakah-lang")==="ar"){document.documentElement.setAttribute("lang","ar");document.documentElement.setAttribute("dir","rtl");}}catch(e){}</script>
<link rel="stylesheet" href="./fonts/fonts.css">
<style>
  :root{ --sp-1:6px; --sp-2:10px; --sp-3:16px; --sp-4:22px; --sp-5:32px; --r-pill:999px; --r-lg:22px; --r-md:12px; --r-sm:8px; --gold:#E3B866; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ color:var(--text); font-family:'Manrope',sans-serif; min-height:100vh; display:flex; justify-content:center; align-items:center;
    padding:calc(env(safe-area-inset-top,0px) + 20px) 16px calc(env(safe-area-inset-bottom,0px) + 20px); -webkit-font-smoothing:antialiased; }
  .wrap{ width:100%; max-width:420px; }
  .prayer-next{ padding:20px 20px 16px; margin-bottom:var(--sp-3); }
  .pn-name{ font-size:24px; } .pn-count{ font-size:40px; } .pn-main{ margin:10px 0 14px; } .pn-bar{ height:7px; }
  .pn-row{ font-size:15px; padding:10px 6px; }
  .back{ display:block; text-align:center; color:var(--text-dim); font-size:13px; text-decoration:none; padding:10px; }
  .back:hover{ color:var(--text); }
  .pn-list{ cursor:default; }
</style>
<link rel="stylesheet" href="./glass.css">
</head>
<body>
<div class="wrap">
  <div class="prayer-next" id="prayerNext" role="button" tabindex="0" aria-label="Prayer times">
    <div class="pn-top"><span class="pn-label">Next prayer</span><span class="pn-where" id="pnWhere"></span></div>
    <div class="pn-main">
      <div class="pn-name"><span id="pnName">—</span><span class="pn-ar" id="pnAr"></span></div>
      <div class="pn-count" id="pnCount">--:--:--</div>
    </div>
    <div class="pn-bar"><div class="pn-bar-fill" id="pnBar"></div></div>
    <div class="pn-at" id="pnAt"></div>
    <div class="pn-list" id="pnList" style="display:block;">
      <div id="pnRows"></div>
      <button class="btn-secondary small" id="pnLocBtn" type="button">📍 Use my location</button>
      <div class="pn-note">Calculated on your phone · Egyptian General Authority method · can differ by a few minutes from your local mosque</div>
    </div>
  </div>
  <a class="back" href="./index.html">← Open Rakah Tracker</a>
</div>
<script>

  /* ===== Prayer times (offline calculation) + next-prayer countdown ===== */
  (function(){
    var R=Math.PI/180, D=180/Math.PI;
    var sin=function(x){return Math.sin(x*R)}, cos=function(x){return Math.cos(x*R)}, tan=function(x){return Math.tan(x*R)};
    function fix(a,b){ a=a-b*Math.floor(a/b); return a<0?a+b:a; }
    function julian(y,m,d){ if(m<=2){y-=1;m+=12;} var A=Math.floor(y/100), B=2-A+Math.floor(A/4); return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5; }
    function sunPos(jd){
      var d=jd-2451545.0, g=fix(357.529+0.98560028*d,360), q=fix(280.459+0.98564736*d,360);
      var L=fix(q+1.915*sin(g)+0.020*sin(2*g),360), e=23.439-0.00000036*d;
      var RA=fix(Math.atan2(cos(e)*sin(L),cos(L))*D,360)/15;
      var eq=q/15-RA; if(eq>12) eq-=24; if(eq<-12) eq+=24;
      return {decl:Math.asin(sin(e)*sin(L))*D, eq:eq};
    }
    // one calendar day's times as Date objects. y,m(1-12),d are the calendar day; lat/lng in degrees.
    function timesFor(y,m,d,lat,lng){
      var jd=julian(y,m,d)-lng/360, sp=sunPos(jd+0.5);
      var noon=12-sp.eq-lng/15;
      function ha(a){ var v=(-sin(a)-sin(lat)*sin(sp.decl))/(cos(lat)*cos(sp.decl)); v=Math.max(-1,Math.min(1,v)); return Math.acos(v)*D/15; }
      var asrAngle=-Math.atan(1/(1+tan(Math.abs(lat-sp.decl))))*D;
      var h={ fajr:noon-ha(19.5), sunrise:noon-ha(0.833), dhuhr:noon, asr:noon+ha(asrAngle), maghrib:noon+ha(0.833), isha:noon+ha(17.5) };
      // Whole minutes, like published timetables: Fajr rounds up (never early), the rest drop the seconds
      for(var q in h) h[q] = (q==='fajr') ? Math.ceil(h[q]*60-1e-9)/60 : Math.floor(h[q]*60+1e-9)/60;
      var base=Date.UTC(y,m-1,d), out={};
      for(var k in h) out[k]=new Date(base+h[k]*3600000);
      return out;
    }
    var NAMES=[['fajr','Fajr','الفجر'],['sunrise','Sunrise','الشروق'],['dhuhr','Dhuhr','الظهر'],['asr','Asr','العصر'],['maghrib','Maghrib','المغرب'],['isha','Isha','العشاء']];
    var PRAYERS=['fajr','dhuhr','asr','maghrib','isha'];
    var DEFAULT={lat:31.2001,lng:29.9187,label:'Alexandria',isDefault:true};
    var loc=DEFAULT;
    try{ var sv=JSON.parse(localStorage.getItem('rakahLoc')||'null'); if(sv&&typeof sv.lat==='number') loc={lat:sv.lat,lng:sv.lng,label:'Your location',isDefault:false}; }catch(e){}

    function daySet(offset){
      var n=new Date(); n.setDate(n.getDate()+offset);
      return timesFor(n.getFullYear(),n.getMonth()+1,n.getDate(),loc.lat,loc.lng);
    }
    function fmt(dt){ return dt.toLocaleTimeString('en-US', {hour:'numeric',minute:'2-digit',hour12:true}); }
    function pad(n){ return (n<10?'0':'')+n; }

    var el=function(id){return document.getElementById(id)};
    function buildSeq(){
      var seq=[];
      [-1,0,1].forEach(function(o){ var t=daySet(o); PRAYERS.forEach(function(k){ seq.push({k:k,t:t[k]}); }); });
      seq.sort(function(a,b){return a.t-b.t});
      return seq;
    }
    var seq=buildSeq(), seqDay=new Date().getDate();
    function nameOf(k){ for(var i=0;i<NAMES.length;i++) if(NAMES[i][0]===k) return NAMES[i]; }

    function renderRows(){
      var t=daySet(0), now=new Date(), nextK=null;
      for(var i=0;i<seq.length;i++) if(seq[i].t>now){ nextK=seq[i].k; break; }
      el('pnRows').innerHTML=NAMES.map(function(n){
        return '<div class="pn-row'+(n[0]===nextK?' next':'')+'"><span>'+n[1]+' <span class="pn-ar">'+n[2]+'</span></span><span class="pn-t">'+fmt(t[n[0]])+'</span></div>';
      }).join('');
      el('pnWhere').textContent=loc.label+(loc.isDefault?' (default)':'');
    }

    function tick(){
      var now=new Date();
      if(now.getDate()!==seqDay){ seq=buildSeq(); seqDay=now.getDate(); renderRows(); }
      var nxt=null, prev=null;
      for(var i=0;i<seq.length;i++){ if(seq[i].t>now){ nxt=seq[i]; prev=seq[i-1]; break; } }
      if(!nxt){ seq=buildSeq(); return; }
      var ms=nxt.t-now, s=Math.floor(ms/1000), h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
      var nm=nameOf(nxt.k);
      el('pnName').textContent=nm[1]; el('pnAr').textContent=nm[2];
      el('pnCount').textContent=pad(h)+':'+pad(m)+':'+pad(sec);
      el('pnAt').textContent='at '+fmt(nxt.t);
      if(prev){ var span=nxt.t-prev.t; el('pnBar').style.width=Math.max(0,Math.min(100,(1-ms/span)*100))+'%'; }
      el('prayerNext').classList.toggle('soon', ms<15*60000);
    }

    function setLoc(lat,lng){
      loc={lat:lat,lng:lng,label:'Your location',isDefault:false};
      try{ localStorage.setItem('rakahLoc',JSON.stringify({lat:lat,lng:lng})); }catch(e){}
      seq=buildSeq(); renderRows(); tick();
    }
    function askLoc(){
      var b=el('pnLocBtn');
      if(!navigator.geolocation){ b.textContent='Location not supported'; return; }
      b.textContent='Getting location…';
      navigator.geolocation.getCurrentPosition(function(p){ b.textContent='📍 Location updated'; setLoc(p.coords.latitude,p.coords.longitude); },
        function(){ b.textContent='Location denied · tap to retry'; }, {timeout:15000, maximumAge:600000});
    }
    el('pnLocBtn').addEventListener('click', function(e){ e.stopPropagation(); askLoc(); });
    function toggle(){ var l=el('pnList'); l.style.display = l.style.display==='none' ? 'block' : 'none'; if(l.style.display==='block') renderRows(); }
    el('prayerNext').addEventListener('click', function(e){ if(e.target.closest('#pnList')) return; toggle(); });
    el('prayerNext').addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggle(); } });
    // quietly use real location if the browser already has permission
    try{ if(loc.isDefault && navigator.permissions){ navigator.permissions.query({name:'geolocation'}).then(function(r){ if(r.state==='granted') navigator.geolocation.getCurrentPosition(function(p){ setLoc(p.coords.latitude,p.coords.longitude); }); }).catch(function(){}); } }catch(e){}
    renderRows(); tick(); setInterval(tick,1000);
  })();
</script>
<script src="./i18n.js"></script>
</body>
</html>
